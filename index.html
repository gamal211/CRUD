<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUDS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="crud">
    <div class="head">
      <h1>CRUD</h1>
      <p>Product Management System</p>
      <button id="modeBtn"> Dark Mode</button>
    </div>

    <div class="inputs">
      <input placeholder="Title" type="text" id="title">

      <div class="price">
        <input onkeyup="getTotal()" type="number" id="price" placeholder="Price">
        <input onkeyup="getTotal()" type="number" id="taxes" placeholder="Taxes">
        <input onkeyup="getTotal()" type="number" id="ads" placeholder="Ads">
        <input onkeyup="getTotal()" type="number" id="discount" placeholder="Discount">
        <small id="total">Total: 0</small>
      </div>

      <input type="number" id="count" placeholder="Count">
      <input type="text" id="category" placeholder="Category">
      <button id="submit">Create</button>
    </div>

    <div class="outputs">
      <div class="searchblock">
        <input type="text" id="search" placeholder="Search">
        <div class="btnsearch">
          <button onclick="setSearchMode('title')">Search By Title</button>
          <button onclick="setSearchMode('category')">Search By Category</button>
        </div>
      </div>

      <div id="deleteAll"></div>

      <table id="dataTable">
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Price</th>
          <th>Taxes</th>
          <th>Ads</th>
          <th>Discount</th>
          <th>Total</th>
          <th>Category</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>
      </table>
    </div>
  </div> 

  <script src="./main.js"></script>
</body>
</html>
